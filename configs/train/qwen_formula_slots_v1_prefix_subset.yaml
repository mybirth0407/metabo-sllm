# V1 plus set-level identity supervision, on scaffold_sub_10.
#
# Everything the V1 subset run had, with two changes and nothing else:
#   supervision  fragment_supervision_v1 -> v2: bags no longer hold candidates
#                that fail the hard valence bounds (7.9 % of v1's candidates;
#                none of the predicted formulas that landed in a bag did).
#   objective    + prefix-tree marginal NLL on the shared formula decoder,
#                conditioned on the molecule rather than a slot, one term per
#                distinct candidate prefix. Weight 1.0 for the first two epochs
#                (2 x 353 optimizer steps), then x0.9 per epoch, after GLACIER's
#                finding that a DETR-style spectrum model needs dense identity
#                supervision early and does better when it is then withdrawn.
#
# What this run has to beat: V1 best, canonical cos@100 = 0.2505 (epoch 27),
# unique-bag argmax-in-bag 24.9 %, far misses 29.1 % of active slots.

name: qwen_formula_slots_v1_prefix_seed0

model_config: configs/model/qwen_formula_slots_v1.yaml

data:
  root: /NHNHOME/26moe001_B/BASE/metabo_data/processed/metabo_sllm/nist23/scaffold_sub_10/fragment_supervision_v2
  fold: train
  valid_fold: valid          # test is never named anywhere in this pipeline
  num_shards: 64
  exclude_zero_target_train: true
  max_text_length: 512

batching:
  max_spectra: 64
  max_qwen_tokens: 16384
  max_linked_candidates: 8192
  bucket_multiplier: 50

training:
  precision: bf16
  gradient_accumulation_steps: 1
  max_grad_norm: 5.0
  find_unused_parameters: false
  ddp_no_sync: true
  epochs: 32
  max_steps: 0               # 0 = run whole epochs
  log_every: 50
  save_every: 0
  seed: 0
  output_dir: /NHNHOME/26moe001_B/BASE/metabo_data/results/metabo_sllm/nist23/scaffold_sub_10/qwen_formula_slots_v1_prefix_seed0
  prefix_warmup_steps: 706
  prefix_decay_rate: 0.9
  prefix_decay_period: 353

optimizer:
  type: AdamW
  fused: true
  learning_rate: 1.5e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.05

loss:
  identity: 1.0
  presence: 0.2
  intensity: 1.0
  spectrum: 1.0
  prefix: 1.0

evaluation:
  upper_limit: 1500
  num_bins: 15000
  min_pred_intensity: 1.0e-5
  top_k: [20, 100]
  presence_threshold: 0.5
  batch_size: 64
  primary_metric: cos@100
  tiebreak_metric: cos@20
