# Full split, continued from the first full run's weights under a gentler
# optimisation regime.
#
# The first full run (qwen_formula_slots_v1_full_seed0, lr 1.5e-4) peaked at
# epoch 0 (canonical cos@100 0.1364) and then fell: between epochs 0 and 1 the
# presence head went from 1,052 zero-prediction spectra to none, predicted
# peaks per spectrum rose to ~40, and active-slot precision collapsed 0.094 ->
# 0.062, while train kept improving and gradients stayed calm. With ten times
# the steps at peak learning rate that the subset run ever saw, the head drifted
# to "on". Fold difficulty is ruled out (same precursor-mass distribution;
# 42.6 % of valid formulas appear in train, against 11.4 % on the subset).
#
# So this run keeps the learned weights (init_from = that run's last
# checkpoint) and changes the regime, several things at once by design:
#   lr        1.5e-4 -> 8e-5, short warm-up, cosine over these six epochs
#   presence  0.2 -> 0.5, to make firing on an unmatched slot cost more
#   predictions are written every epoch so presence thresholds can be swept
#   afterwards without re-running the model.

name: qwen_formula_slots_v1_full_warm_seed0

model_config: configs/model/qwen_formula_slots_v1.yaml

data:
  root: /NHNHOME/26moe001_B/BASE/metabo_data/processed/metabo_sllm/nist23/bmscaffold_1/fragment_supervision_v2
  fold: train
  valid_fold: valid          # test is never named anywhere in this pipeline
  num_shards: 64
  exclude_zero_target_train: true
  max_text_length: 512

batching:
  max_spectra: 64
  max_qwen_tokens: 16384
  max_linked_candidates: 8192
  bucket_multiplier: 50

training:
  precision: bf16
  gradient_accumulation_steps: 1
  max_grad_norm: 5.0
  find_unused_parameters: false
  ddp_no_sync: true
  epochs: 6
  max_steps: 0               # 0 = run whole epochs
  log_every: 100
  save_every: 0
  seed: 1                    # a different data order than the run it continues
  output_dir: /NHNHOME/26moe001_B/BASE/metabo_data/results/metabo_sllm/nist23/bmscaffold_1/qwen_formula_slots_v1_full_warm_seed0
  init_from: /NHNHOME/26moe001_B/BASE/metabo_data/results/metabo_sllm/nist23/bmscaffold_1/qwen_formula_slots_v1_full_seed0/checkpoints/last

optimizer:
  type: AdamW
  fused: true
  learning_rate: 8.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: cosine
  warmup_ratio: 0.02
  min_lr_ratio: 0.05

loss:
  identity: 1.0
  presence: 0.5
  intensity: 1.0
  spectrum: 1.0

evaluation:
  upper_limit: 1500
  num_bins: 15000
  min_pred_intensity: 1.0e-5
  top_k: [20, 100]
  presence_threshold: 0.5
  batch_size: 64
  primary_metric: cos@100
  tiebreak_metric: cos@20
